<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 SoulMine 組隊系統 👻</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <link rel="stylesheet" href="style.css?v=83">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://unpkg.com/drag-drop-touch"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>
</head>
<body>
    <!-- Create Raid Modal -->
    <div id="create-raid-modal" class="modal-overlay" style="display:none; z-index: 1000;">
        <div class="glass-card modal-content" style="max-width: 500px; padding: 2rem;">
            <h2>➕ 建立新出團</h2>
            <p class="subtitle" style="margin-bottom: 1.5rem;">設定出團目標與時間，招募隊友！</p>
            <form id="create-raid-form">
                <div class="form-group">
                    <label>發起人稱呼</label>
                    <input type="text" id="raid-creator-name" placeholder="例如: 小明" required>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <div class="form-group" style="flex: 1.2;">
                        <label>討伐目標</label>
                        <select id="raid-boss" required style="width: 100%;">
                            <option value="樹王">樹王</option>
                            <option value="困拉">困拉</option>
                            <option value="普拉">普拉</option>
                            <option value="龍王">龍王</option>
                            <option value="炎魔">炎魔</option>
                            <option value="蝴蝶">蝴蝶</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>出團場次</label>
                        <select id="raid-games" required style="width: 100%;">
                            <option value="7">7 場</option>
                            <option value="14">14 場</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>出團日期</label>
                        <input type="text" id="raid-date" required placeholder="點擊選擇日期" style="width: 100%;">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>出團時段</label>
                        <select id="raid-time-select" required style="width: 100%;">
                            <option value="">請先選擇出團日期</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0.5rem; font-weight: 600; color: #fff;">
                        <input type="checkbox" id="create-join-self" checked style="width: 18px; height: 18px; accent-color: var(--primary-color);">
                        發起人同時入座（如僅代開時段請取消勾選）
                    </label>
                    <div id="create-self-char-fields" style="display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.5rem;">
                        <input type="text" id="create-char-name" placeholder="遊戲ID (例: 煞氣a明)">
                        <div style="display: flex; gap: 0.8rem;">
                            <select id="create-char-job" style="flex: 1;">
                                <option value="主教">主教</option>
                                <option value="箭神">箭神</option>
                                <option value="神射手">神射手</option>
                                <option value="英雄">英雄</option>
                                <option value="聖騎士">聖騎士</option>
                                <option value="黑騎士">黑騎士</option>
                                <option value="夜使者">夜使者</option>
                                <option value="暗影神偷">暗影神偷</option>
                                <option value="冰雷">冰雷</option>
                                <option value="火毒">火毒</option>
                                <option value="拳霸">拳霸</option>
                                <option value="槍神">槍神</option>
                            </select>
                            <input type="number" id="create-char-level" placeholder="等級 (例: 120)" min="1" max="250" style="flex: 1;">
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" id="btn-cancel-create" class="btn-secondary" style="flex: 1;">取消</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">發佈招募</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Join Raid Modal -->
    <div id="join-raid-modal" class="modal-overlay" style="display:none; z-index: 1000;">
        <div class="glass-card modal-content" style="max-width: 420px; padding: 2rem;">
            <h2>報名出團</h2>
            <p id="join-slot-desc" class="subtitle" style="margin-bottom: 1.5rem;">請填寫角色資訊加入該位置（系統將自動記憶）。</p>
            <form id="join-raid-form">
                <input type="hidden" id="join-raid-id">
                <input type="hidden" id="join-slot-index">
                <div class="form-group">
                    <label>遊戲ID</label>
                    <input type="text" id="join-char-name" placeholder="請輸入遊戲名稱" required>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>職業</label>
                        <select id="join-char-job" required style="width: 100%;">
                            <option value="主教">主教</option>
                            <option value="箭神">箭神</option>
                            <option value="神射手">神射手</option>
                            <option value="英雄">英雄</option>
                            <option value="聖騎士">聖騎士</option>
                            <option value="黑騎士">黑騎士</option>
                            <option value="夜使者">夜使者</option>
                            <option value="暗影神偷">暗影神偷</option>
                            <option value="冰雷">冰雷</option>
                            <option value="火毒">火毒</option>
                            <option value="拳霸">拳霸</option>
                            <option value="槍神">槍神</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>等級</label>
                        <input type="number" id="join-char-level" placeholder="例如: 120" min="1" max="250" required>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" id="btn-cancel-join" class="btn-secondary" style="flex: 1;">取消</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">確認報名</button>
                </div>
            </form>
        </div>
    </div>

    <div class="app-container" id="main-app">
        <header class="app-header">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem;">
                <h1 style="margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem);">🎃 SoulMine 揪團佈告欄 👻</h1>
                <button id="btn-admin-auth" class="btn-secondary" style="font-size: 0.85rem; padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.06); cursor: pointer; transition: all 0.2s;">
                    🔑 管理員登入
                </button>
            </div>
            <nav class="tabs">
                <button class="tab-btn active" data-target="tab-recruit">1. 招募大廳</button>
                <button class="tab-btn" data-target="tab-status">2. 出團看板</button>
                <button class="tab-btn" data-target="tab-changelog">3. 更新日誌</button>
            </nav>
        </header>

        <main class="content-area">
            <!-- Tab 1: Recruitment Board -->
            <section id="tab-recruit" class="tab-content active">
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <h2 style="margin: 0;">📋 招募大廳</h2>
                            <p class="subtitle" style="margin: 0;">目前正在尋找隊友的隊伍，點擊「➕ 點擊報名」即可加入。</p>
                        </div>
                        <button id="btn-open-create-modal" class="btn-primary" style="font-size: 1.1rem; padding: 0.8rem 1.5rem; background: var(--success-color); border-color: var(--success-color); color: #111; font-weight: bold; box-shadow: 0 4px 15px rgba(86, 211, 100, 0.4);">➕ 開啟新招募</button>
                    </div>
                    
                    <div id="recruit-container" style="display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                        <!-- JS 會動態渲染招募中的隊伍 -->
                    </div>
                </div>
            </section>

            <!-- Tab 2: Confirmed Raids -->
            <section id="tab-status" class="tab-content">
                <div class="glass-card">
                    <h2>✅ 已確認出團名單</h2>
                    <p class="subtitle" style="margin-bottom: 1.5rem;">已經額滿或由團長確認的出團陣容。</p>
                    <div id="confirmed-teams-container" style="display: grid; gap: 1.5rem;" class="two-col-grid">
                        <!-- JS 會動態渲染成團資訊 -->
                    </div>
                </div>
                
                <div class="glass-card" style="margin-top: 2rem; background: rgba(0,0,0,0.02);">
                    <h2 style="color: var(--text-muted); margin-bottom: 0.5rem;">📜 歷史出團紀錄</h2>
                    <p class="subtitle" style="margin-bottom: 1.5rem;">已過期的團隊紀錄。</p>
                    <div id="historical-teams-container" style="display: grid; gap: 1.5rem;" class="two-col-grid">
                        <!-- JS 會動態渲染歷史紀錄 -->
                    </div>
                </div>
            </section>

            <!-- Tab 3: Changelog -->
            <section id="tab-changelog" class="tab-content">
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;">
                        <div>
                            <h2 style="margin: 0;">更新日誌</h2>
                            <p class="subtitle" style="margin: 0;">紀錄系統的更新與重要變更。</p>
                        </div>
                    </div>
                    
                    <form id="changelog-form" style="display: none; flex-direction: column; gap: 1rem; margin-bottom: 2rem; background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--primary-color);">
                        <h3 style="margin: 0; color: var(--primary-color);">📝 管理員發布更新日誌</h3>
                        <div class="input-group">
                            <label>更新標題</label>
                            <input type="text" id="changelog-title" placeholder="輸入標題..." required>
                        </div>
                        <div class="input-group">
                            <label>發布者稱呼</label>
                            <input type="text" id="changelog-author" placeholder="例: Lumi" required>
                        </div>
                        <div class="input-group">
                            <label>更新內容</label>
                            <textarea id="changelog-content" placeholder="輸入詳細更新內容..." rows="4" required style="width:100%; padding: 0.8rem; border: 1px solid var(--input-border); border-radius: 8px; font-family: inherit; font-size: 1rem; background: var(--bg-main); color: var(--text-main);"></textarea>
                        </div>
                        <button type="submit" class="btn-primary">確認發佈日誌</button>
                    </form>

                    <div id="changelog-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- JS generated changelogs -->
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- Firebase -->
    <link rel="stylesheet" href="style.css?v=83">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="app.js?v=83" defer></script>
</body>
</html>
